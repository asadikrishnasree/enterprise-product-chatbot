services:
  chroma:
    image: chromadb/chroma:latest
    container_name: enterprise-chatbot-chroma
    ports:
      - "8000:8000"
    volumes:
      - ./chroma-data:/data
    restart: unless-stopped

  chatbot-service:
    build:
      context: ./chatbot-service
    container_name: enterprise-chatbot-service
    ports:
      - "3001:3001"
    env_file:
      - ./chatbot-service/.env
    environment:
      PORT: 3001
      FRONTEND_URL: http://localhost:8080
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
      KNOWLEDGE_BASE_PATH: /knowledge-base
    volumes:
      - ./knowledge-base:/knowledge-base:ro
    depends_on:
      - chroma
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: enterprise-chatbot-frontend
    ports:
      - "8080:80"
    depends_on:
      - chatbot-service
    restart: unless-stopped