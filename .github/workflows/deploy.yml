name: Deploy Enterprise Chatbot

on:
  push:
    branches:
      - feature/chatbot-microservice

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: enterprise-chatbot-service
  ECS_CLUSTER: enterprise-chatbot-cluster
  ECS_SERVICE: enterprise-chatbot-service
  S3_BUCKET: enterprise-product-chatbot-frontend-044246318324
  CLOUDFRONT_DISTRIBUTION_ID: EBRVSOE0HEQV1

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::044246318324:role/EnterpriseChatbotGitHubActionsRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build backend image
        run: |
          docker build \
            -f Dockerfile.backend.aws \
            -t $ECR_REPOSITORY:${{ github.sha }} \
            .

      - name: Tag and push backend image
        run: |
          ECR_URI=044246318324.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}

          docker tag \
            $ECR_REPOSITORY:${{ github.sha }} \
            $ECR_URI:latest

          docker push $ECR_URI:latest

      - name: Restart ECS service
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment \
            --region "$AWS_REGION"

  deploy-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::044246318324:role/EnterpriseChatbotGitHubActionsRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: /api
        run: npm run build

      - name: Upload frontend to S3
        run: |
          aws s3 sync \
            frontend/dist/ \
            "s3://$S3_BUCKET" \
            --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"
